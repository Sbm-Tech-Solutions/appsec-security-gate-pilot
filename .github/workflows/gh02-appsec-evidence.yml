
name: GH02 AppSec Evidence Automation

on:
  workflow_dispatch:
    inputs:
      alert_number:
        description: "CodeQL alert number"
        required: true
        type: string
        default: "13"

      pull_request:
        description: "Related PR number"
        required: false
        type: string
        default: "7"

      dismissal_request_url:
        description: "Original dismissal request URL"
        required: false
        type: string

      dismissal_reason:
        description: "Original developer justification"
        required: false
        type: string

      developer_username:
        description: "Developer username, if lookup is unavailable"
        required: false
        type: string
        default: "shastyblinksmartin"

      appsec_questions:
        description: "Additional evidence requested by AppSec"
        required: true
        type: string
        default: "Explain why this finding is not exploitable and provide supporting evidence."

      create_issue:
        description: "Create or update evidence Issue"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gh02-evidence-${{ inputs.alert_number }}
  cancel-in-progress: false

jobs:
  appsec-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APPSEC_APP_ID }}
          private-key: ${{ secrets.APPSEC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-security-events: read
          permission-issues: write

      - name: Retrieve CodeQL metadata and manage evidence
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ALERT_NUMBER: ${{ inputs.alert_number }}
          PR_NUMBER: ${{ inputs.pull_request }}
          DISMISSAL_URL: ${{ inputs.dismissal_request_url }}
          DISMISSAL_REASON: ${{ inputs.dismissal_reason }}
          DEVELOPER_USERNAME: ${{ inputs.developer_username }}
          APPSEC_QUESTIONS: ${{ inputs.appsec_questions }}
          CREATE_ISSUE: ${{ inputs.create_issue }}

        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import json
          import subprocess
          import sys
          from urllib.parse import urlparse

          repo = os.environ["GH_REPO"]
          alert_num = os.environ["ALERT_NUMBER"].strip()
          pr_num = os.environ.get("PR_NUMBER", "").strip()
          developer = os.environ.get(
              "DEVELOPER_USERNAME", ""
          ).strip()
          create_issue = (
              os.environ.get("CREATE_ISSUE", "false").lower()
              == "true"
          )

          if not re.fullmatch(r"[1-9][0-9]*", alert_num):
              sys.exit("Invalid alert number")

          if pr_num and not re.fullmatch(r"[1-9][0-9]*", pr_num):
              sys.exit("Invalid PR number")

          if developer and not re.fullmatch(
              r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?",
              developer
          ):
              sys.exit("Invalid developer username")

          def api(path, method="GET", payload=None):
              command = [
                  "gh", "api",
                  "-H", "Accept: application/vnd.github+json",
                  path
              ]

              if method != "GET":
                  command += ["--method", method]

              if payload is not None:
                  command += ["--input", "-"]

              result = subprocess.run(
                  command,
                  input=json.dumps(payload) if payload is not None else None,
                  text=True,
                  capture_output=True
              )

              if result.returncode != 0:
                  raise RuntimeError(
                      f"GitHub API error: {result.stderr.strip()}"
                  )

              return (
                  json.loads(result.stdout)
                  if result.stdout.strip() else {}
              )

          def clean(value):
              return str(
                  value if value is not None else "Unavailable"
              ).replace("\r", " ").replace("\n", " ")

          # Retrieve CodeQL alert
          alert = api(
              f"/repos/{repo}/code-scanning/alerts/{alert_num}"
          )

          rule = alert.get("rule") or {}
          instance = alert.get("most_recent_instance") or {}
          location = instance.get("location") or {}

          finding = (
              rule.get("description")
              or rule.get("name")
              or "Unknown finding"
          )

          severity = (
              rule.get("security_severity_level")
              or rule.get("severity")
              or "Unknown"
          )

          rule_id = rule.get("id") or "Unavailable"

          cwes = sorted({
              f"CWE-{match.group(1)}"
              for tag in (rule.get("tags") or [])
              if (match := re.search(
                  r"cwe[-/](\d+)", tag, re.IGNORECASE
              ))
          }, key=lambda x: int(x.split("-")[1]))

          file_path = location.get("path") or "Unavailable"
          line = location.get("start_line") or "Unavailable"
          ref = instance.get("ref") or "Unavailable"

          alert_url = (
              alert.get("html_url")
              or f"https://github.com/{repo}/security/code-scanning/{alert_num}"
          )

          state = (
              alert.get("state")
              or alert.get("status")
              or "Not returned by API"
          )

          # Validate PR association
          if pr_num and ref.startswith("refs/pull/"):
              actual_pr = ref.split("/")[2]
              if pr_num != actual_pr:
                  sys.exit(
                      f"PR mismatch: entered #{pr_num}, "
                      f"but alert belongs to PR #{actual_pr}"
                  )

          if not pr_num and ref.startswith("refs/pull/"):
              pr_num = ref.split("/")[2]

          pr_url = (
              f"https://github.com/{repo}/pull/{pr_num}"
              if pr_num else "Not provided"
          )

          # Validate original dismissal reference
          dismissal_url = os.environ.get(
              "DISMISSAL_URL", ""
          ).strip()

          if dismissal_url:
              parsed = urlparse(dismissal_url)
              if (
                  parsed.scheme != "https"
                  or parsed.hostname != "github.com"
                  or not parsed.path.startswith(f"/{repo}/")
              ):
                  sys.exit("Invalid dismissal reference URL")

          dismissal_reason = os.environ.get(
              "DISMISSAL_REASON", ""
          ).strip()

          questions = os.environ.get(
              "APPSEC_QUESTIONS", ""
          ).strip()

          # Request lookup status
          # Organization dismissal requests require a separate
          # verified API lookup and request identifier.
          # Never infer requester identity from the PR author.
          requester_source = (
              "Manual pilot input"
              if developer else "Not verified"
          )

          print("CodeQL metadata retrieved successfully")
          print("Alert:", alert_num)
          print("Finding:", finding)
          print("Severity:", severity)
          print("CWEs:", ", ".join(cwes))
          print("File:", file_path)
          print("Line:", line)
          print("PR:", pr_num or "Unavailable")
          print("Developer:", developer or "Not verified")

          marker = f"<!-- gh02-evidence:{repo}:{alert_num} -->"

          body = f"""## Security Alert Information

          **Finding:** {clean(finding)}

          **Severity:** {clean(severity)}

          **CWE:** {", ".join(cwes) or "Unavailable"}

          **CWE Description:** Refer to https://cwe.mitre.org/

          **CodeQL Rule ID:** {clean(rule_id)}

          **Repository:** {repo}

          **Affected File:** {clean(file_path)}

          **Line Number:** {clean(line)}

          **Source to Sink Path:** Review original CodeQL alert.

          **Pull Request:** {pr_url}

          **Alert URL:** {alert_url}

          **Alert Status:** {clean(state)}

          **Affected Ref:** {clean(ref)}

          ## Original Dismissal Request

          **Request URL:** {dismissal_url or "Not provided"}

          **Requested Disposition:** Verify in original request.

          **Developer:** {developer or "Not verified"}

          **Developer Source:** {requester_source}

          **Original Justification:**

          {dismissal_reason or "Not provided"}

          **Request Date:** Verify in GitHub.

          **Request Expiration:** Verify in GitHub.

          **Request Status:** Verify in GitHub.

          ## AppSec Evidence Request

          {questions}

          ## Developer Justification

          Explain why this finding should be dismissed.

          ## Supporting Evidence

          Provide:
          - Relevant code references
          - Screenshots or test results
          - Security validation evidence
          - Supporting documentation

          Do not include secrets or credentials.

          ## Production Impact

          Is this code deployed or executable in production?

          Explain the security impact.

          ## Compensating Controls

          Describe existing security controls.

          ## Developer Response

          Provide answers to AppSec questions and evidence links.

          ## AppSec Decision

          **Status:** Awaiting Developer Evidence

          **Decision:** Pending

          **Reviewer:** TBD

          **Decision Rationale:** Pending

          **Review Date:** Pending

          **Original Dismissal Request Status:** Verify in GitHub

          Closing this Issue does not approve or deny the original
          GitHub dismissal request.

          {marker}
          """

          body = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          )

          # Execution summary
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## GH02 AppSec Evidence Automation\n\n")
              summary.write(f"Alert: #{alert_num}\n\n")
              summary.write(f"Finding: {clean(finding)}\n\n")
              summary.write(f"Severity: {clean(severity)}\n\n")
              summary.write(
                  f"CWE: {', '.join(cwes) or 'Unavailable'}\n\n"
              )
              summary.write(
                  f"Developer: {developer or 'Not verified'}\n\n"
              )
              summary.write(
                  f"Mode: {'Create or Update' if create_issue else 'Preview Only'}\n"
              )

          if not create_issue:
              print("Preview completed. No Issue modified.")
              sys.exit(0)

          if not dismissal_url:
              sys.exit(
                  "Dismissal reference URL is required for Issue creation"
              )

          # Find existing Issue to avoid duplicates
          existing = None
          page = 1

          while True:
              issues = api(
                  f"/repos/{repo}/issues"
                  f"?state=all&per_page=100&page={page}"
              )

              for issue in issues:
                  if "pull_request" in issue:
                      continue

                  if marker in (issue.get("body") or ""):
                      existing = issue
                      break

              if existing or len(issues) < 100:
                  break

              page += 1

          # Validate developer is assignable
          assignees = []

          if developer:
              result = subprocess.run(
                  [
                      "gh", "api",
                      f"/repos/{repo}/assignees/{developer}"
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode == 0:
                  assignees = [developer]
              else:
                  print(
                      "Developer is not assignable. "
                      "Issue will require manual assignment."
                  )

          if existing:
              issue_number = existing["number"]

              print(
                  "Existing evidence Issue found:",
                  existing["html_url"]
              )

              current_assignees = [
                  user["login"]
                  for user in existing.get("assignees", [])
              ]

              if (
                  developer
                  and assignees
                  and developer.lower() not in [
                      x.lower() for x in current_assignees
                  ]
              ):
                  api(
                      f"/repos/{repo}/issues/{issue_number}/assignees",
                      method="POST",
                      payload={"assignees": assignees}
                  )

                  print("Developer assigned:", developer)

              print("Duplicate Issue creation prevented.")
              sys.exit(0)

          title = (
              f"[AppSec Evidence Required] "
              f"CodeQL #{alert_num}: {finding}"
          )[:240]

          payload = {
              "title": title,
              "body": body,
              "labels": [
                  "security-disposition-review",
                  "status:awaiting-developer"
              ]
          }

          if assignees:
              payload["assignees"] = assignees

          created = api(
              f"/repos/{repo}/issues",
              method="POST",
              payload=payload
          )

          print("Evidence Issue created:", created["html_url"])
          print(
              "Assigned developer:",
              developer if assignees else "Manual assignment required"
          )
          PY
