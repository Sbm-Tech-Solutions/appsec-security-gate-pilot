
name: GH02 AppSec Evidence Metadata Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-app-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APPSEC_APP_ID }}
          private-key: ${{ secrets.APPSEC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-security-events: read

      - name: Retrieve CodeQL alert metadata
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api \
            "/repos/${GH_REPO}/code-scanning/alerts/13" \
            --jq '{
              number: .number,
              state: .state,
              url: .html_url,
              severity: .rule.security_severity_level,
              rule_id: .rule.id,
              description: .rule.description,
              cwe: [.rule.tags[]? | select(startswith("external/cwe/cwe-"))],
              file: .most_recent_instance.location.path,
              start_line: .most_recent_instance.location.start_line,
              ref: .most_recent_instance.ref
            }'
